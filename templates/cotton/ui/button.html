{% if "/" in attrs.href or attrs.href == "#" %}
    <a href="{{ attrs.href }}"
        class="{{ attrs.class }}"
        {{ attributes }}>
        {{ slot }}
    </a>
{% else %}
    <button type="{{ attrs.type|default:'button' }}"
            class="{{ attrs.class }}"
            {% if attrs.onclick %} @click="{{ attrs.onclick }}" {% endif %}
            {{ attributes }}>
        {{ slot }}
    </button>
{% endif %}
