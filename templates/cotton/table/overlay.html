<c-vars loader_id="" loader_text="Cargando..." />

<div id="{{ attrs.id }}" class="flex-1 relative min-h-0 flex flex-col overflow-hidden bg-transparent rounded-b-2xl {{ attrs.class }}">

    {% if loader_id %}
    <div id="{{ loader_id|cut:'#' }}" class="htmx-indicator pointer-events-none opacity-0 [&.htmx-request]:opacity-100 [&.htmx-request]:pointer-events-auto absolute inset-0 z-50 bg-white/85 dark:bg-brandBg/85 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-200 rounded-b-2xl">
        <i class="ti ti-loader animate-spin text-xl mb-2 inline-block"></i>
        <span class="text-xs font-semibold tracking-wider text-slate-600 dark:text-brandMuted mt-2">{{ loader_text }}</span>
    </div>
    {% endif %}

    {{ slot }}
</div>
